[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv"]

[tool.ruff.lint]
# Keep the first lint baseline focused on defects rather than formatting churn.
select = ["E9", "F63", "F7", "F82", "F401"]

[tool.ruff.lint.per-file-ignores]
# These entry points adjust sys.path before importing application modules.
"devel/run.py" = ["E402"]
"script/firebase.py" = ["E402"]
"test/run.py" = ["E402"]

